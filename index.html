/* =========================================================
   状態
   ========================================================= */

let currentQuestion = 0;
let scores = {};


/* =========================================================
   診断開始
   ========================================================= */

function startDiagnosis() {

  currentQuestion = 0;
  scores = {};

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.add("hidden");
  document.getElementById("questionScreen").classList.remove("hidden");

  showQuestion();

}


/* =========================================================
   質問表示
   ========================================================= */

function showQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("progress").textContent =
    `Q${currentQuestion + 1} / ${questions.length}`;

  document.getElementById("progressInner").style.width =
    `${((currentQuestion) / questions.length) * 100}%`;

  document.getElementById("questionText").textContent = q.text;

  document.getElementById("questionNote").textContent =
    q.note || "";

  const answers = document.getElementById("answers");
  answers.innerHTML = "";

  q.answers.forEach((answer) => {

    const button = document.createElement("button");

    button.className = "answer";
    button.textContent = answer[0];

    button.onclick = function() {
      selectAnswer(answer[1]);
    };

    answers.appendChild(button);

  });

}


/* =========================================================
   回答
   ========================================================= */

function selectAnswer(score) {

  const q = questions[currentQuestion];

  scores[q.id] = score;

  currentQuestion++;

  if (currentQuestion >= questions.length) {
    showResult();
  } else {
    showQuestion();
  }

}


/* =========================================================
   世代スコア
   ========================================================= */

function getGenerationQuestions(generation) {

  return questions.filter(q =>
    q.generation.includes(generation)
  );

}


function getGenerationScore(generation) {

  const qs = getGenerationQuestions(generation);

  let obtained = 0;
  let maximum = 0;

  qs.forEach(q => {

    const selected = scores[q.id] || 0;

    obtained += selected;

    const maxScore = Math.max(
      ...q.answers.map(a => a[1])
    );

    maximum += maxScore;

  });

  const raw = maximum === 0
    ? 0
    : (obtained / maximum) * 100;

  // 指定どおり四捨五入
  const rounded = Math.round(raw);

  return {
    obtained,
    maximum,
    percentage: rounded
  };

}


/* =========================================================
   重要質問正解率
   ========================================================= */

function getImportantRate(generation) {

  const config = generationConfig[generation];

  let correct = 0;

  config.important.forEach(id => {

    if ((scores[id] || 0) > 0) {
      correct++;
    }

  });

  const rate =
    (correct / config.important.length) * 100;

  return {
    correct,
    total: config.important.length,
    percentage: Math.round(rate)
  };

}


/* =========================================================
   必須質問
   ========================================================= */

function requiredCleared(generation) {

  const required = generationConfig[generation].required;

  return (scores[required] || 0) > 0;

}


/* =========================================================
   正式条件
   ========================================================= */

function isFormal(generation) {

  const config = generationConfig[generation];

  const important = getImportantRate(generation);
  const generationScore = getGenerationScore(generation);

  return (
    important.percentage >= 50 &&
    generationScore.percentage >= config.formalThreshold &&
    requiredCleared(generation)
  );

}


/* =========================================================
   准条件
   ========================================================= */

function isPreGeneration(generation) {

  const important = getImportantRate(generation);
  const generationScore = getGenerationScore(generation);

  return (
    important.correct >= 1 &&
    generationScore.percentage >= 50 &&
    requiredCleared(generation)
  );

}


/* =========================================================
   結果判定
   ========================================================= */

function determineResult() {

  for (let generation = 1; generation <= 5; generation++) {

    if (isFormal(generation)) {
      return generation;
    }

    if (isPreGeneration(generation)) {
      return `pre${generation}`;
    }

  }

  return "newcomer";

}


/* =========================================================
   結果表示
   ========================================================= */

function showResult() {

  document.getElementById("questionScreen")
    .classList.add("hidden");

  document.getElementById("resultScreen")
    .classList.remove("hidden");

  const resultKey = determineResult();
  const result = results[resultKey];

  document.getElementById("resultTitle").textContent =
    result.title;

  document.getElementById("resultDescription").textContent =
    result.description;

  createScoreSummary();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================================================
   スコア表示
   ========================================================= */

function createScoreSummary() {

  const container =
    document.getElementById("resultScore");

  container.innerHTML = "";

  for (let generation = 1; generation <= 5; generation++) {

    const score =
      getGenerationScore(generation);

    const important =
      getImportantRate(generation);

    const row =
      document.createElement("div");

    row.className = "score-row";

    row.innerHTML =
      `<span>第${generation}世代</span>
       <strong>${score.percentage}%</strong>`;

    container.appendChild(row);

  }

}


/* =========================================================
   X投稿
   ========================================================= */

function shareOnX() {

  const resultKey = determineResult();
  const result = results[resultKey];

  const pageUrl =
    window.location.href.split("#")[0];

  const text =
    `m HOLD'EM世代診断の結果は「${result.title}」でした！\n\n` +
    `あなたは何世代？👇`;

  const xUrl =
    "https://twitter.com/intent/tweet" +
    "?text=" + encodeURIComponent(text) +
    "&url=" + encodeURIComponent(pageUrl);

  window.open(
    xUrl,
    "_blank",
    "noopener,noreferrer"
  );

}


/* =========================================================
   再診断
   ========================================================= */

function restartDiagnosis() {

  currentQuestion = 0;
  scores = {};

  document.getElementById("resultScreen")
    .classList.add("hidden");

  document.getElementById("questionScreen")
    .classList.remove("hidden");

  showQuestion();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}

</script>
