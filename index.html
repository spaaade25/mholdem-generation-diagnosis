<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">

  <title>エムホールデム世代診断</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      background: white;
      border-radius: 20px;
      padding: 30px 22px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .progress {
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
      text-align: center;
    }

    .question {
      font-size: 22px;
      line-height: 1.5;
      font-weight: 800;
      text-align: center;
      margin-bottom: 25px;
    }

    .answer {
      display: block;
      width: 100%;
      min-height: 56px;
      margin: 12px 0;
      padding: 12px 16px;
      border: 2px solid #ddd;
      border-radius: 14px;
      background: white;
      color: #222;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
    }

    .answer:active {
      transform: scale(0.98);
    }

    .answer:hover {
      border-color: #111;
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="card">

      <div class="progress">
        Q1 / 10
      </div>

      <div class="question">
        エムホールデムを始めたのはいつ？
      </div>

      <button class="answer" onclick="answer(10)">
        A：サービス開始直後から
      </button>

      <button class="answer" onclick="answer(7)">
        B：かなり初期から
      </button>

      <button class="answer" onclick="answer(4)">
        C：途中から始めた
      </button>

      <button class="answer" onclick="answer(1)">
        D：最近始めた
      </button>

    </section>

  </main>

  <script>
    function answer(score) {
      alert("回答を受け付けました！\n今回のスコア：" + score);
    }
  </script>

</body>
</html>
