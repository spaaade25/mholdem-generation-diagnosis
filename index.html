let idx=0;
let ans={};


function startQuiz(){

  idx=0;
  ans={};

  document.getElementById("start").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");

  showQ();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


function showQ(){

  const q=questions[idx];

  document.getElementById("progressText").textContent=
    `Q${idx+1} / ${questions.length}`;

  document.getElementById("progressBar").style.width=
    `${(idx/questions.length)*100}%`;

  document.getElementById("question").textContent=q.text;

  document.getElementById("note").textContent=q.note||"";

  const box=document.getElementById("answers");

  box.innerHTML="";

  q.a.forEach(([label,score])=>{

    const b=document.createElement("button");

    b.className="answer";

    b.textContent=label;

    b.onclick=()=>choose(b,score);

    box.appendChild(b);

  });

}


function choose(button,score){

  button.classList.add("selected");

  ans[questions[idx].id]=score;

  setTimeout(()=>{

    idx++;

    if(idx<questions.length){

      showQ();

    }else{

      finish();

    }

  },150);

}


function scoreFor(g){

  let got=0;
  let max=0;

  questions
    .filter(q=>q.g.includes(g))
    .forEach(q=>{

      got+=ans[q.id]||0;

      max+=Math.max(
        ...q.a.map(x=>x[1])
      );

    });

  return {
    got,
    max,
    pct:max
      ? Math.round(got/max*100)
      : 0
  };

}


function importantFor(g){

  const ids=cfg[g].important;

  const correct=ids.filter(
    id=>(ans[id]||0)>0
  ).length;

  return {
    correct,
    total:ids.length,
    pct:ids.length
      ? Math.round(correct/ids.length*100)
      : 0
  };

}


function requiredFor(g){

  return (ans[cfg[g].required]||0)>0;

}


function formal(g){

  const s=scoreFor(g);
  const im=importantFor(g);

  return (
    s.pct>=cfg[g].threshold &&
    im.pct>=50 &&
    requiredFor(g)
  );

}


function semi(g){

  const s=scoreFor(g);
  const im=importantFor(g);

  return (
    s.pct>=50 &&
    im.pct>=50 &&
    requiredFor(g)
  );

}


function getResult(){

  for(let g=1;g<=5;g++){

    if(formal(g)){
      return String(g);
    }

    if(semi(g)){
      return "pre"+g;
    }

  }

  return "newcomer";

}


function finish(){

  const key=getResult();
  const r=resultText[key];

  // 診断結果をSupabaseへ保存
  const generation =
    key === "newcomer"
      ? "newcomer"
      : key.startsWith("pre")

        : "第" + key + "世代";

  saveDiagnosisResult(generation);

  document.getElementById("quiz").classList.add("hidden");

  document.getElementById("result").classList.remove("hidden");

  document.getElementById("resultTitle").textContent=r[0];

  document.getElementById("resultComment").textContent=r[1];

  document.getElementById("progressBar").style.width="100%";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}
